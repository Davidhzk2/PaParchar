<div class="modalAdd__content" [class.male]="gender === 'male'" [class.female]="gender === 'female'">

  <div class="modalAdd__playerInfo">

    <fieldset class="genderSelect player">
      <legend>Selecciona el género del jugador</legend>

      <div class="genderContainerInput">

        <label class="genderButton male" [class.selected]="gender === 'male'" for="player-gender-male">

            </g>
          </svg>
          <span>Hombre</span>
        </label>

        <label class="genderButton female" [class.selected]="gender === 'female'" for="player-gender-female">
          <input id="player-gender-female" type="radio" name="playerGender" value="female" [ngModel]="gender"
            (ngModelChange)="onGenderChange($event)" />
          <svg viewBox="0 -1 30 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g>
              <path
                d="M21.942 6.00736C19.4636 2.03796 15.8439 0.905194 12.7163 3.11392C11.0057 4.32241 9.62424 5.81804 8.82677 7.32629C7.71803 9.42458 7.72396 11.5702 8.84752 13.3687C9.9207 15.0884 11.6372 16.3505 13.5612 16.8364C13.7568 16.8869 13.9525 16.9248 14.1452 16.9563C14.1452 16.9627 14.1452 16.9658 14.1422 16.9721C14.0859 17.3003 14.0296 19.569 14.0296 20.7901C12.826 20.8185 11.7884 20.85 11.4534 20.91C10.7804 21.0299 10.1638 21.4748 10.1638 22.3709C10.1638 23.0556 10.7508 23.6835 11.5067 23.8003C11.8417 23.8287 12.8526 23.8602 14.0563 23.8886C14.0829 25.1697 14.1393 26.274 14.1956 26.6306C14.2786 27.3752 14.6996 28 15.5385 28C16.2115 28 16.7718 27.4036 16.8815 26.5706C16.9378 26.2141 16.9645 25.1413 16.9645 23.8886C17.9724 23.8602 18.8411 23.8287 19.262 23.7687C20.187 23.6488 20.8303 23.1439 20.8303 22.3078C20.8303 21.4716 20.2137 21.0551 19.3747 20.8784C19.0397 20.7901 18.0851 20.7585 16.9675 20.7585C16.9408 19.6857 16.9111 17.5085 16.8548 17.0605C16.8489 17.0037 16.837 16.95 16.8281 16.8932C17.679 16.7008 18.4883 16.3442 19.2235 15.8236C20.8985 14.6403 22.0754 13.1826 22.6327 11.6112C23.2968 9.73065 23.0567 7.79328 21.942 6.0042V6.00736ZM19.8579 10.5037C19.5288 11.4377 18.7195 12.3937 17.5841 13.1984C16.6354 13.8704 15.4496 14.0724 14.243 13.7695C13.0453 13.4666 11.9781 12.6872 11.317 11.627C10.9998 11.119 10.6678 10.286 11.4119 8.87871C11.9751 7.81536 13.0483 6.67313 14.3557 5.74862C14.9427 5.33212 15.503 5.16173 16.0247 5.16173C17.5722 5.16173 18.7936 6.66682 19.4725 7.75857C20.0565 8.69254 20.181 9.59181 19.8579 10.51V10.5037Z" />
            </g>
          </svg>
          <span>Mujer</span>
        </label>

      </div>
    </fieldset>
    <div class="avatar-container">
      <img src="assets/Logo.png" alt="Avatar" class="avatar-image" />
    </div>


    <input id="player-name" class="namePlayer" type="text" placeholder="Nombre del jugador" autocomplete="off"
      [(ngModel)]="playerName" />

    <fieldset class="genderSelect prefer">
      <legend>¿Con quiénes quiere jugar?</legend>
      <div class="genderContainerInput">
        <label class="genderButton both" [class.selected]="genderPreference === 'both'" for="gender-preference-both">
          <input id="gender-preference-both" type="radio" name="genderPreference" value="both"
            [(ngModel)]="genderPreference" />
          <img src="assets/Iconos/maleFemale.svg" alt="" />
          <span>Ambos</span>
        </label>
        <label class="genderButton female" [class.selected]="genderPreference === 'female'"
          for="gender-preference-female">
          <input id="gender-preference-female" type="radio" name="genderPreference" value="female"
            [(ngModel)]="genderPreference" />
          <img src="assets/Iconos/female.svg" alt="" />
          <span>Mujeres</span>
        </label>
        <label class="genderButton male" [class.selected]="genderPreference === 'male'" for="gender-preference-male">
          <input id="gender-preference-male" type="radio" name="genderPreference" value="male"
            [(ngModel)]="genderPreference" />
          <img src="assets/Iconos/male.svg" alt="" />
          <span>Hombres</span>
        </label>
      </div>
    </fieldset>

    <div class="modalCta">
      <button class="btnPrimary" type="button" (click)="addPlayer()">
        <h4>
          Agregar Jugador
        </h4>
      </button>
      <button class="btnCancel" type="button" (click)="closeModal()">
        Cancelar
      </button>
    </div>

  </div>

  <div class="modalBase">

    <svg viewBox="0 0 315 500" xmlns="http://www.w3.org/2000/svg" class="baseContent">
      <path
        d="M18.5185 18.5185C18.5185 18.5185 18.5185 0 157.407 0C296.296 0 296.296 18.5185 296.296 18.5185C296.296 18.5185 314.815 18.5185 314.815 250C314.815 481.481 296.296 481.481 296.296 481.481C296.296 481.481 296.296 500 157.407 500C18.5185 500 18.5185 481.481 18.5185 481.481C18.5185 481.481 0 481.481 0 250C0 18.5185 18.5185 18.5185 18.5185 18.5185Z" />
    </svg>

    <svg viewBox="0 0 315 500" xmlns="http://www.w3.org/2000/svg" class="baseGradient">
      <path
        d="M18.5185 18.5185C18.5185 18.5185 18.5185 0 157.407 0C296.296 0 296.296 18.5185 296.296 18.5185C296.296 18.5185 314.815 18.5185 314.815 250C314.815 481.481 296.296 481.481 296.296 481.481C296.296 481.481 296.296 500 157.407 500C18.5185 500 18.5185 481.481 18.5185 481.481C18.5185 481.481 0 481.481 0 250C0 18.5185 18.5185 18.5185 18.5185 18.5185Z" />
    </svg>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="gradDynamic" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" class="stop-a" />
          <stop offset="100%" class="stop-b" />
        </linearGradient>
      </defs>
    </svg>
  </div>


</div>
