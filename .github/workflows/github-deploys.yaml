name: Deploy Ionic app to Github Pages

on:
  push:
    branches:
      - main
    workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page
  cancel-in-progress: false


jobs: 
  build:
  runs-on: ubuntu-latest

  steps: 
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    width:
    node-version: 22
    cache: npm

  - name: Install dependencies
    run: npm ci 

  - name: Build ionic app
    run: npm run build -- --configuration production --base-href /PaParchar/

  - name: Upload Pages artifact
    uses: actions/upload-pages-artifact@v3
    width:
      path: www

deploy:
  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
  runs-on: ubuntu-latest
  needs: build
  permissions:
    pages: write
    id-token: write

  steps:
    - name: Deply to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4  